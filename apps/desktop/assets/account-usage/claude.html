<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Claude Usage</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px/1.35 Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0e0e0e;
        color: #f5f5f4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 85% 0%, #2a1b14 0, transparent 38%), #0e0e0e;
      }
      main {
        min-height: 100vh;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid #40342d;
        border-radius: 9px;
        background: #211914;
        color: #d97757;
      }
      .logo svg {
        width: 21px;
        height: 21px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .plan {
        color: #a8a29e;
        font-size: 11px;
        margin-top: 2px;
      }
      #updated {
        margin-left: auto;
        color: #78716c;
        font-size: 10px;
        text-align: right;
        white-space: nowrap;
      }
      .card {
        border: 1px solid #2a2928;
        border-radius: 10px;
        background: rgba(23, 23, 22, 0.92);
        padding: 12px;
      }
      .bars {
        display: grid;
        gap: 11px;
      }
      .bar-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 5px;
      }
      .bar-label {
        font-weight: 580;
      }
      .bar-meta {
        color: #a8a29e;
        font-size: 10px;
      }
      .track {
        height: 7px;
        overflow: hidden;
        border-radius: 3px;
        background: #343230;
      }
      .fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #c86143, #e08a68);
        transition: width 0.25s ease;
      }
      .fill.warning {
        background: linear-gradient(90deg, #d97706, #f59e0b);
      }
      .trend-head,
      .extra {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .section-label {
        color: #a8a29e;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #sparkline {
        width: 100%;
        height: 54px;
        margin-top: 5px;
        overflow: visible;
      }
      #sparkline polyline {
        fill: none;
        stroke: #d97757;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .extra strong {
        font-size: 12px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      .tile {
        min-width: 0;
        border: 1px solid #292827;
        border-radius: 8px;
        background: #151514;
        padding: 9px 8px;
      }
      .tile-label {
        color: #a8a29e;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .tile-cost {
        height: 18px;
        margin-top: 5px;
        font-weight: 650;
      }
      .tile-tokens {
        color: #d6d3d1;
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .notice {
        color: #fbbf24;
        font-size: 11px;
      }
      .notice:empty {
        display: none;
      }
      footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      a {
        flex: 1;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid #393735;
        border-radius: 7px;
        color: #e7e5e4;
        text-decoration: none;
        background: #191918;
      }
      a:hover {
        background: #242321;
        border-color: #57534e;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9" />
            <circle cx="12" cy="12" r="4.3" fill="currentColor" stroke="none" />
          </svg>
        </div>
        <div>
          <h1>Claude Usage</h1>
          <div class="plan" id="plan">Checking Claude Code login…</div>
        </div>
        <div id="updated"></div>
      </header>
      <section class="card bars" id="bars"></section>
      <section class="card">
        <div class="trend-head">
          <span class="section-label">Usage trend</span><span id="trendTotal">0 tokens</span>
        </div>
        <svg id="sparkline" viewBox="0 0 330 54" preserveAspectRatio="none" role="img" aria-label="Daily token usage">
          <polyline points=""></polyline>
        </svg>
        <div class="extra"><span class="section-label">Extra Usage</span><strong id="extra">Not enabled</strong></div>
      </section>
      <section class="tiles">
        <div class="tile">
          <div class="tile-label">Today</div>
          <div class="tile-cost" id="todayCost"></div>
          <div class="tile-tokens" id="todayTokens"></div>
        </div>
        <div class="tile">
          <div class="tile-label">Yesterday</div>
          <div class="tile-cost" id="yesterdayCost"></div>
          <div class="tile-tokens" id="yesterdayTokens"></div>
        </div>
        <div class="tile">
          <div class="tile-label">Last 30 days</div>
          <div class="tile-cost" id="thirtyCost"></div>
          <div class="tile-tokens" id="thirtyTokens"></div>
        </div>
      </section>
      <div class="notice" id="notice"></div>
      <footer>
        <a href="https://status.anthropic.com" target="_blank" rel="noopener noreferrer">Status</a
        ><a href="https://claude.ai/settings/usage" target="_blank" rel="noopener noreferrer">Dashboard</a>
      </footer>
    </main>
    <script>
      __ACCOUNT_SCRIPT__;
    </script>
  </body>
</html>
