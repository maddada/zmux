<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Codex Usage</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px/1.35 Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #111;
        color: #f5f5f4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 85% 0%, #1c2831 0, transparent 42%), #0e0e0e;
      }
      main {
        min-height: 100vh;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid #343b40;
        border-radius: 9px;
        background: #182027;
        color: #fcfcfc;
      }
      .logo svg {
        width: 22px;
        height: 22px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .plan {
        color: #a8a29e;
        font-size: 11px;
        margin-top: 2px;
      }
      #updated {
        margin-left: auto;
        color: #78716c;
        font-size: 10px;
        text-align: right;
        white-space: nowrap;
      }
      .card {
        border: 1px solid #2a2d2f;
        border-radius: 11px;
        background: rgba(28, 29, 30, 0.94);
        padding: 13px;
        display: grid;
        gap: 12px;
      }
      #coreBars,
      #sparkBars {
        display: grid;
        gap: 11px;
      }
      .bar-head,
      .bar-foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .bar-head {
        margin-bottom: 5px;
      }
      .bar-foot {
        margin-top: 4px;
        color: #aaa6a2;
        font-size: 10px;
      }
      .bar-label {
        font-weight: 620;
      }
      .bar-meta {
        color: #ff6574;
        font-size: 10px;
      }
      .track {
        height: 6px;
        overflow: hidden;
        border-radius: 3px;
        background: #3a3d3f;
      }
      .fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #92a8b5, #d7e2e8);
        transition: width 0.25s ease;
      }
      .fill.warning {
        background: linear-gradient(90deg, #ff4056, #ff5969);
      }
      .trend {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 10px;
      }
      .trend-label {
        font-weight: 620;
      }
      .trend-bars {
        height: 32px;
        display: flex;
        align-items: flex-end;
        gap: 2px;
      }
      .trend-bars span {
        flex: 1;
        min-width: 2px;
        border-radius: 2px 2px 0 0;
        background: #1997f3;
      }
      .section-divider {
        height: 1px;
        background: #303234;
      }
      .metrics {
        display: grid;
        gap: 8px;
      }
      .metric {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .metric-label {
        font-weight: 600;
      }
      .metric-value {
        text-align: right;
        color: #dedbd8;
        font-variant-numeric: tabular-nums;
      }
      .reset-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: #1b9cf5;
      }
      .notice {
        color: #fbbf24;
        font-size: 11px;
      }
      .notice:empty {
        display: none;
      }
      footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      a {
        flex: 1;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid #393d40;
        border-radius: 7px;
        color: #e7e5e4;
        text-decoration: none;
        background: #191b1c;
      }
      a:hover {
        background: #24282a;
        border-color: #596168;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <path
              fill="currentColor"
              d="M83.8 42.8a20.2 20.2 0 0 0-23.4-26A20.2 20.2 0 0 0 26.1 24a20.2 20.2 0 0 0-10.8 33.3 20.2 20.2 0 0 0 23.4 26A20.2 20.2 0 0 0 72.9 76a20.2 20.2 0 0 0 10.9-33.2ZM53.7 84.8a15 15 0 0 1-9.6-3.4l16.4-9.5a2.6 2.6 0 0 0 1.3-2.3V47.2l6.8 3.9v18.8a15 15 0 0 1-14.9 15ZM21.5 71.1a15 15 0 0 1-1.8-10l16.4 9.4a2.6 2.6 0 0 0 2.6 0l19.5-11.2v7.8L42 76.6a15 15 0 0 1-20.5-5.5Zm-4.2-34.7a15 15 0 0 1 7.9-6.6v18.9a2.6 2.6 0 0 0 1.3 2.3l19.4 11.2-6.8 3.9-16.3-9.3a15 15 0 0 1-5.5-20.4Zm55.3 12.8L53.2 38l6.7-3.9 16.3 9.3A15 15 0 0 1 74 70.4V51.5a2.6 2.6 0 0 0-1.4-2.3Zm6.7-10-16.4-9.6a2.6 2.6 0 0 0-2.6 0L40.9 40.8V33l16.2-9.4a15 15 0 0 1 22.2 15.6ZM37.2 53l-6.7-3.9V30.3a15 15 0 0 1 24.4-11.5l-16.4 9.5a2.6 2.6 0 0 0-1.3 2.3V53Zm3.6-8 8.7-5 8.7 5v10.1l-8.7 5-8.7-5Z"
            />
          </svg>
        </div>
        <div>
          <h1>Codex Usage</h1>
          <div class="plan" id="plan">Checking Codex login…</div>
        </div>
        <div id="updated"></div>
      </header>
      <section class="card">
        <div id="coreBars"></div>
        <div class="trend">
          <span class="trend-label">Usage Trend</span>
          <div class="trend-bars" id="trend"></div>
        </div>
        <div class="section-divider"></div>
        <div id="sparkBars"></div>
        <div class="metrics">
          <div class="metric">
            <span class="metric-label">Extra Usage</span><span class="metric-value" id="credits">No data</span>
          </div>
          <div class="metric">
            <span class="metric-label">Rate Limit Resets</span><span class="metric-value" id="resets">No data</span>
          </div>
          <div class="metric">
            <span class="metric-label">Today</span><span class="metric-value" id="today">No data</span>
          </div>
          <div class="metric">
            <span class="metric-label">Yesterday</span><span class="metric-value" id="yesterday">No data</span>
          </div>
          <div class="metric">
            <span class="metric-label">Last 30 Days</span><span class="metric-value" id="thirtyDays">No data</span>
          </div>
        </div>
      </section>
      <div class="notice" id="notice"></div>
      <footer>
        <a href="https://status.openai.com/" target="_blank" rel="noopener noreferrer">Status</a
        ><a href="https://chatgpt.com/codex/settings/usage" target="_blank" rel="noopener noreferrer">Dashboard</a>
      </footer>
    </main>
    <script>
      __ACCOUNT_SCRIPT__;
    </script>
  </body>
</html>
